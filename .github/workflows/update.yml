name: Update snow data

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - id: build
        run: npm run build
        env:
          LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Stamp file URLs with this commit so phones and installed apps load fresh code after each change.
      - run: sed -i "s/__V__/${GITHUB_SHA::8}/g" public/index.html public/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
