name: Update snow data

on:
  # Every 15 minutes during lift hours (~6 AM–7 PM Colorado time), hourly overnight. Odd minutes
  # because GitHub delays or skips scheduled jobs most at the top of the hour.
  schedule:
    - cron: '7,22,37,52 13-23 * * *'
    - cron: '7,22,37,52 0-1 * * *'
    - cron: '7 2-12 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_states:
        description: Refresh every state's forecasts now (normally a few states per run)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - id: build
        run: npm run build
        env:
          LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          ALL_STATES: ${{ inputs.all_states && '1' || '' }}
          # Forecasts the maintainer's Mac mini fetched, for when GitHub can't reach the weather models.
          DATA_BRANCH_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/
      # Stamp file URLs with this commit so phones and installed apps load fresh code after each change.
      - run: sed -i "s/__V__/${GITHUB_SHA::8}/g" public/index.html public/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
